name: kaori-docs

services:
  web:
    image: ${KAORI_DOCS_IMAGE:?KAORI_DOCS_IMAGE must be an immutable digest reference}
    restart: unless-stopped
    init: true
    read_only: true
    security_opt:
      - no-new-privileges:true
    volumes:
      - ${KAORI_DOCS_ANALYTICS_DIR:-/var/lib/kaori-docs/deploy-state/analytics-public}:/usr/share/nginx/html/.well-known/kaori-analytics:ro
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    expose:
      - '8080'
    mem_limit: 128m
    cpus: 0.50
    pids_limit: 100
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'
    healthcheck:
      test:
        - CMD-SHELL
        - wget -q -O /dev/null http://127.0.0.1:8080/healthz
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - docs-internal

networks:
  docs-internal:
    internal: true
