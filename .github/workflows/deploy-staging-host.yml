name: Release Deployment
run-name: 'Release Deployment · ${{ inputs.candidate_tag || github.event.workflow_run.head_sha || github.sha }}'
on:
  # Issue #40: only successful MAIN stable publication, never signed RC alone.
  # GitHub GITHUB_TOKEN-issued releases do not trigger another release workflow;
  # workflow_run completion is the canonical, independently verified handoff.
  workflow_run:
    workflows: [Full Admission]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      candidate_tag:
        description: Exact approved staging RC for manual UAT (not required for stable)
        type: string
        required: false
      stable_tag:
        description: Exact accepted main stable version for one-time production UAT (vX.Y.Z)
        type: string
        required: false
      approval_reference:
        description: Issue #14 approval comment with exact SHA/tag/digest marker
        type: string
        required: true
      publish_existing_edge:
        description: Reconcile only an already approved docs.kaori.cloud registration (never first publication)
        type: boolean
        required: true
        default: false
permissions:
  contents: read
  actions: read
  issues: read
concurrency:
  group: kaori-docs-release-deploy
  cancel-in-progress: false
jobs:
  deploy:
    name: Deploy Release Candidate
    if: >-
      ${{
        github.event_name == 'workflow_dispatch' ||
        (
          github.event_name == 'workflow_run' &&
          vars.KAORI_DOCS_STABLE_AUTO_DEPLOY_ENABLED == 'true' &&
          github.event.workflow_run.conclusion == 'success' &&
          github.event.workflow_run.event == 'workflow_dispatch' &&
          github.event.workflow_run.head_branch == 'main' &&
          github.event.workflow_run.head_repository.full_name == github.repository
        )
      }}
    runs-on: [self-hosted, linux, x64, kaori-ci]
    timeout-minutes: 45
    env:
      ACCEPTED_SHA: ${{ github.sha }}
      RC_TAG: ${{ inputs.candidate_tag }}
      APPROVAL_REF: ${{ inputs.approval_reference }}
      KAORI_DOCS_AUTO_POLICY: '0'
      KAORI_DOCS_STABLE_POLICY: ${{ (github.event_name == 'workflow_run' || (inputs.stable_tag != '' && github.ref == 'refs/heads/main')) && '1' || '0' }}
      KAORI_DOCS_STABLE_MANUAL: ${{ github.event_name == 'workflow_dispatch' && inputs.stable_tag != '' && '1' || '0' }}
      KAORI_DOCS_STAGING_UAT: ${{ github.event_name == 'workflow_dispatch' && inputs.stable_tag == '' && '1' || '0' }}
      KAORI_DOCS_MAIN_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || (inputs.stable_tag != '' && github.sha || '') }}
      KAORI_DOCS_STABLE_TAG: ${{ inputs.stable_tag }}
      KAORI_DOCS_STABLE_RUN_ID: ${{ github.event.workflow_run.id }}
      KAORI_DOCS_ATTACH_EXISTING_EDGE: ${{ github.event_name == 'workflow_run' && '1' || (inputs.publish_existing_edge && '1' || '0') }}
      GH_TOKEN: ${{ github.token }}
      REGISTRY_HOST: ${{ vars.KAORI_DOCS_DOCKER_REGISTRY_HOST }}
      REGISTRY_IMAGE: ${{ vars.KAORI_DOCS_DOCKER_REGISTRY_IMAGE }}
      REGISTRY_USER: ${{ secrets.KAORI_DOCS_DOCKER_REGISTRY_USERNAME }}
      REGISTRY_PASSWORD: ${{ secrets.KAORI_DOCS_DOCKER_REGISTRY_PASSWORD }}
      DOCS_HOST: ${{ vars.KAORI_DOCS_HOST }}
      DOCS_SSH_PORT: ${{ vars.KAORI_DOCS_HOST_PORT }}
      DOCS_SSH_USER: ${{ vars.KAORI_DOCS_HOST_USER }}
      DOCS_DEPLOY_ROOT: ${{ vars.KAORI_DOCS_HOST_DEPLOY_ROOT }}
      DOCS_PUBLIC_DOMAIN: ${{ vars.KAORI_DOCS_PUBLIC_DOMAIN }}
      DOCS_SSH_KEY: ${{ secrets.KAORI_DOCS_HOST_SSH_PRIVATE_KEY }}
      DOCS_SSH_PASSPHRASE: ${{ secrets.KAORI_DOCS_HOST_SSH_PASSPHRASE }}
      DOCS_KNOWN_HOSTS: ${{ secrets.KAORI_DOCS_HOST_KNOWN_HOSTS }}
    steps:
      - name: Checkout exact approved source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Resolve explicitly approved one-time stable UAT without standing auto policy
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.stable_tag != '' }}
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "$GITHUB_REF" == refs/heads/main && "$GITHUB_REPOSITORY" == OXY7O/kaori-docs ]] ||
            { echo 'BLOCK: manual stable release requires main' >&2; exit 1; }
          [[ "$KAORI_DOCS_STABLE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ &&
             "$APPROVAL_REF" =~ ^https://github[.]com/OXY7O/kaori-docs/issues/40#issuecomment-[0-9]+$ ]] ||
            { echo 'BLOCK: exact main stable tag and issue #40 approval required' >&2; exit 1; }
          [[ "$KAORI_DOCS_ATTACH_EXISTING_EDGE" == 1 ]] ||
            { echo 'BLOCK: stable UAT must reconcile approved public Docs-only edge' >&2; exit 1; }
          api="https://api.github.com/repos/$GITHUB_REPOSITORY"
          headers=(-H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json')
          get() { curl --fail-with-body -fsS "${headers[@]}" "$1"; }
          [[ "$(get "$api/git/ref/heads/main" | jq -r '.object.sha')" == "$KAORI_DOCS_MAIN_SHA" ]] ||
            { echo 'BLOCK: stale main source' >&2; exit 1; }
          release="$(get "$api/releases/tags/$KAORI_DOCS_STABLE_TAG")"
          [[ "$(jq -r '.draft' <<< "$release")" == false &&
             "$(jq -r '.prerelease' <<< "$release")" == false &&
             "$(jq -r '.target_commitish' <<< "$release")" == "$KAORI_DOCS_MAIN_SHA" ]] ||
            { echo 'BLOCK: unaccepted main stable release' >&2; exit 1; }
          body="$(jq -r '.body // ""' <<< "$release")"
          rc="$(grep -E '^Accepted RC: v[0-9]+\.[0-9]+\.[0-9]+-rc\.[1-9][0-9]*$' <<< "$body" | cut -d' ' -f3)"
          source="$(grep -E '^Accepted RC source SHA: [a-f0-9]{40}$' <<< "$body" | awk '{print $5}')"
          run="$(grep -E '^Stable publication workflow run: [0-9]+$' <<< "$body" | awk '{print $5}')"
          [[ "$rc" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-rc\.[1-9][0-9]*$ &&
             "${rc%-rc.*}" == "$KAORI_DOCS_STABLE_TAG" &&
             "$source" =~ ^[a-f0-9]{40}$ && "$run" =~ ^[0-9]+$ ]] ||
            { echo 'BLOCK: stable release exact RC/source/run identity missing' >&2; exit 1; }
          printf 'ACCEPTED_SHA=%s\nRC_TAG=%s\nKAORI_DOCS_STABLE_RUN_ID=%s\n' "$source" "$rc" "$run" >> "$GITHUB_ENV"
          echo 'PASS: per-digest approved manual stable UAT resolved; crypto/host checks remain mandatory'
      - name: Resolve exact stable main publication and separately approved Docs production policy
        if: ${{ github.event_name == 'workflow_run' }}
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "$GITHUB_REF" == refs/heads/main && "$GITHUB_REPOSITORY" == OXY7O/kaori-docs ]] || exit 1
          [[ "$KAORI_DOCS_MAIN_SHA" =~ ^[a-f0-9]{40}$ && "$KAORI_DOCS_STABLE_RUN_ID" =~ ^[0-9]+$ ]] || exit 1
          api="https://api.github.com/repos/$GITHUB_REPOSITORY"
          headers=(-H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json')
          get() { curl --fail-with-body -fsS "${headers[@]}" "$1"; }
          [[ "$(get "$api/git/ref/heads/main" | jq -r '.object.sha')" == "$KAORI_DOCS_MAIN_SHA" ]] ||
            { echo 'BLOCK: stale main source; no production cutover' >&2; exit 1; }
          upstream="$(get "$api/actions/runs/$KAORI_DOCS_STABLE_RUN_ID")"
          jq -e --arg sha "$KAORI_DOCS_MAIN_SHA" '
            .path == ".github/workflows/quality.yml" and
            .event == "workflow_dispatch" and .head_branch == "main" and
            .head_repository.full_name == "OXY7O/kaori-docs" and
            .head_sha == $sha and .status == "completed" and .conclusion == "success"
          ' <<< "$upstream" >/dev/null || { echo 'BLOCK: untrusted main publisher run' >&2; exit 1; }
          upstream_jobs="$(get "$api/actions/runs/$KAORI_DOCS_STABLE_RUN_ID/jobs?per_page=100")"
          jq -e '[.jobs[] | select(.name == "Publish Accepted Stable Release" and .conclusion == "success")] | length == 1' <<< "$upstream_jobs" >/dev/null ||
            { echo 'BLOCK: no successful stable publication job' >&2; exit 1; }
          # One stable release for the event run; never select arbitrary/latest
          # GitHub release or trust a mutable tag without source/run agreement.
          all="$(get "$api/releases?per_page=100")"
          matching="$(jq -c --arg sha "$KAORI_DOCS_MAIN_SHA" --arg run "$KAORI_DOCS_STABLE_RUN_ID" '
            [.[] | select(.draft == false and .prerelease == false and .target_commitish == $sha)
                 | select(.tag_name | test("^v[0-9]+\\.[0-9]+\\.[0-9]+$"))
                 | select((.body // "" | split("\n") | index("Stable publication workflow run: " + $run)) != null)]
          ' <<< "$all")"
          [[ "$(jq length <<< "$matching")" == 1 ]] ||
            { echo 'BLOCK: stable publication must map to exactly one main-SHA/run/tag' >&2; exit 1; }
          tag="$(jq -r '.[0].tag_name' <<< "$matching")"
          body="$(jq -r '.[0].body' <<< "$matching")"
          rc="$(grep -E '^Accepted RC: v[0-9]+\.[0-9]+\.[0-9]+-rc\.[1-9][0-9]*$' <<< "$body" | cut -d' ' -f3)" ||
            { echo 'BLOCK: accepted RC missing' >&2; exit 1; }
          source="$(grep -E '^Accepted RC source SHA: [a-f0-9]{40}$' <<< "$body" | awk '{print $5}')" ||
            { echo 'BLOCK: signed RC SHA missing' >&2; exit 1; }
          [[ "$rc" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-rc\.[1-9][0-9]*$ &&
             "${rc%-rc.*}" == "$tag" && "$source" =~ ^[a-f0-9]{40}$ ]] ||
            { echo 'BLOCK: stable release/RC identity mismatch' >&2; exit 1; }
          [[ "$(get "$api/git/ref/tags/$tag" | jq -r '.object.sha')" == "$KAORI_DOCS_MAIN_SHA" ]] ||
            { echo 'BLOCK: stable tag not on accepted main' >&2; exit 1; }
          # Separate opt-in standing production authority. Lack of an exact
          # approved issue #40 policy blocks before any SSH/registry step.
          comments="$(get "$api/issues/40/comments?per_page=100")"
          approved="$(jq -c '[.[] | select((.body // "" | split("\n") |
            index("KAORI_DOCS_STABLE_AUTO_DEPLOY_APPROVED:docs.kaori.cloud:docker.io/lethisaputri/kaori-docs:main-stable-only")) != null)]' <<< "$comments")"
          [[ "$(jq length <<< "$approved")" == 1 ]] ||
            { echo 'BLOCK: stable Docs production policy not uniquely approved' >&2; exit 1; }
          approval="$(jq -r '.[0].html_url' <<< "$approved")"
          [[ "$approval" =~ ^https://github[.]com/OXY7O/kaori-docs/issues/40#issuecomment-[0-9]+$ ]] || exit 1
          printf 'ACCEPTED_SHA=%s\nRC_TAG=%s\nAPPROVAL_REF=%s\nKAORI_DOCS_STABLE_TAG=%s\n' "$source" "$rc" "$approval" "$tag" >> "$GITHUB_ENV"
          echo 'PASS: exact successful main stable publication and separate Docs production policy resolved'
      - name: Verify prerelease, pinned host and explicit approval reference
        shell: bash
        run: bash scripts/release/deploy-release.sh preflight
      - name: Deploy via separate pinned SSH trust boundary
        shell: bash
        run: bash scripts/release/deploy-release.sh deploy
      - name: Record signed private deployment and acceptance boundary
        shell: bash
        run: |
          printf 'KAORI Docs private deployment: candidate %s, source %s\n' "$RC_TAG" "$ACCEPTED_SHA" >> "$GITHUB_STEP_SUMMARY"
          printf 'Authorization reference: %s\n' "$APPROVAL_REF" >> "$GITHUB_STEP_SUMMARY"
          printf 'SIGNED IMMUTABLE DIGEST VERIFIED; HOST RELEASE RECEIPT COMMITTED.\n' >> "$GITHUB_STEP_SUMMARY"
          if [[ "$KAORI_DOCS_ATTACH_EXISTING_EDGE" == 1 ]]; then
            printf 'PREVIOUSLY PUBLISHED DOCS EDGE REATTACHED; FULL SHARED-EDGE VERIFICATION PASS.\n' >> "$GITHUB_STEP_SUMMARY"
          else
            printf 'PRIVATE LOOPBACK ONLY; PUBLIC EDGE/DNS/TLS: NOT VERIFIED.\n' >> "$GITHUB_STEP_SUMMARY"
          fi
          printf 'HUMAN VISUAL ACCEPTANCE / PROMOTION: PENDING.\n' >> "$GITHUB_STEP_SUMMARY"
