name: Full Admission
run-name: "Full Admission · ${{ github.event_name == 'pull_request' && format('PR #{0}', github.event.pull_request.number) || github.ref_name }} · ${{ github.sha }}"

on:
  push:
    branches:
      - kaori/staging
      - main
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
      - converted_to_draft
  workflow_dispatch:
    inputs:
      stable_version:
        description: 'Approved Docs stable SemVer, e.g. v0.1.0 (optional; absent means validation only)'
        type: string
        required: false
      accepted_candidate_tag:
        description: 'Exactly accepted, signed RC for stable promotion, e.g. v0.1.0-rc.3'
        type: string
        required: false
      stable_approval_reference:
        description: 'Human-accepted issue #39 comment URL binding main/RC/stable/digest'
        type: string
        required: false

permissions:
  contents: read
  actions: read

concurrency:
  group: kaori-docs-admission-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  KAORI_DOCS_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  promotion-source:
    name: Promotion Policy
    runs-on: [self-hosted, linux, x64, platform-ci]
    timeout-minutes: 5
    steps:
      - name: Verify permitted source and target
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          set -Eeuo pipefail
          if [[ "$EVENT_NAME" == pull_request ]]; then
            [[ "$BASE_REF" == main && "$HEAD_REPO" == "$GITHUB_REPOSITORY" && "$HEAD_REF" == kaori/staging ]] || {
              echo 'Only kaori/staging may open a promotion PR to main.' >&2
              exit 1
            }
          elif [[ "$EVENT_NAME" == workflow_dispatch ]]; then
            [[ "$GITHUB_REF" == refs/heads/kaori/staging || "$GITHUB_REF" == refs/heads/main ]] || {
              echo 'Manual admission is limited to governed branches.' >&2
              exit 1
            }
          else
            [[ "$GITHUB_REF" == refs/heads/kaori/staging || "$GITHUB_REF" == refs/heads/main ]] || exit 1
          fi

  validation-profile:
    name: Resolve Admission Evidence
    needs: promotion-source
    runs-on: [self-hosted, linux, x64, platform-ci]
    timeout-minutes: 8
    permissions:
      contents: read
      actions: read
    outputs:
      reuse: ${{ steps.evidence.outputs.reuse }}
      evidence_run_id: ${{ steps.evidence.outputs.evidence_run_id }}
      reason: ${{ steps.evidence.outputs.reason }}
    env:
      GH_TOKEN: ${{ github.token }}
      ADMISSION_HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
    steps:
      - name: Checkout exact integrated Docs source with ancestry
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.KAORI_DOCS_SOURCE_SHA }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify immutable source/tree and route existing evidence
        id: evidence
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "$KAORI_DOCS_SOURCE_SHA"
          python3 scripts/ci/admission-reuse.py resolve
          echo 'Evidence is advisory until fresh smoke or comprehensive fallback PASS' >> "$GITHUB_STEP_SUMMARY"

  full-admission:
    name: Full Admission
    needs: [promotion-source, validation-profile]
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    runs-on: [self-hosted, linux, x64, kaori-ci]
    timeout-minutes: 40
    steps:
      - name: Recover only runner checkout ownership from prior browser job
        shell: bash
        run: |
          set -Eeuo pipefail
          uid="$(id -u)"
          gid="$(id -g)"
          [[ -n "$GITHUB_WORKSPACE" && -d "$GITHUB_WORKSPACE" ]] || exit 1
          docker run --rm --network=none --user 0 \
            --mount "type=bind,src=$GITHUB_WORKSPACE,dst=/workspace" \
            --entrypoint /usr/bin/chown mcr.microsoft.com/playwright:v1.56.1-noble \
            -R "$uid:$gid" /workspace
      - name: Checkout accepted exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.KAORI_DOCS_SOURCE_SHA }}
          persist-credentials: false
      - name: Require lock and verify exact SHA
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "$KAORI_DOCS_SOURCE_SHA"
          test -s package-lock.json || { echo 'BLOCK: missing reproducible lockfile.' >&2; exit 1; }
          printf 'Source: %s\nTree: %s\n' "$(git rev-parse HEAD)" "$(git show -s --format=%T HEAD)" >> "$GITHUB_STEP_SUMMARY"
      - name: Report verified reuse or full fallback
        shell: bash
        env:
          REUSE: ${{ needs.validation-profile.outputs.reuse }}
          EVIDENCE_RUN_ID: ${{ needs.validation-profile.outputs.evidence_run_id }}
        run: |
          set -Eeuo pipefail
          if [[ "$REUSE" == true ]]; then
            [[ "$EVIDENCE_RUN_ID" =~ ^[1-9][0-9]*$ ]] ||
              { echo 'BLOCK: reuse lacks trusted prior full run' >&2; exit 1; }
            printf 'REUSED: Full Admission evidence from trusted staging run #%s. Fresh Browser/Runtime Smoke still mandatory.\n' "$EVIDENCE_RUN_ID" >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'FALLBACK: full formatting, TypeScript, security audit and Docusaurus build required.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Set up pinned Node
        if: ${{ needs.validation-profile.outputs.reuse != 'true' }}
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v4.4.0
        with:
          node-version: '22.23.2'
          cache: npm
      - name: Install locked dependencies
        if: ${{ needs.validation-profile.outputs.reuse != 'true' }}
        run: npm ci --no-audit --no-fund
      - name: Check formatting
        if: ${{ needs.validation-profile.outputs.reuse != 'true' }}
        run: npm run check-format
      - name: Check TypeScript and MDX configuration
        if: ${{ needs.validation-profile.outputs.reuse != 'true' }}
        run: npm run check
      - name: Dependency security audit
        if: ${{ needs.validation-profile.outputs.reuse != 'true' }}
        run: npm audit --audit-level=high
      - name: Build static documentation
        if: ${{ needs.validation-profile.outputs.reuse != 'true' }}
        run: npm run build
      - name: Check approved static scope
        if: ${{ needs.validation-profile.outputs.reuse != 'true' }}
        shell: bash
        run: |
          set -Eeuo pipefail
          test -s build/index.html
          test -s build/branding/kaori-logo.svg
          grep -Fq 'KAORI Documentation' build/index.html
          for path in docs/ARCHITECTURE.md docs/CONTENT_SAFETY.md .github .devcontainer package.json package-lock.json content; do
            test ! -e "build/$path" || { echo "Public scope leaked: $path" >&2; exit 1; }
          done
          if [[ -d build/v0.0 ]]; then
            echo 'Unverified application version route is forbidden.' >&2
            exit 1
          fi
          # #57: the reviewed concise publication notice replaces the old
          # long bootstrap sentence. Keep the same fail-closed public-corpus
          # gate while checking current, truthful unversioned-page semantics.
          grep -Fq 'Documentation status' build/index.html
          grep -Fq 'Versioned guides, release notes, and search appear after review.' build/index.html
          grep -Fq 'In preparation' build/index.html
          echo 'PASS: bootstrap public scope, truthful unpublished documentation state.' >> "$GITHUB_STEP_SUMMARY"

  container-admission:
    name: Container Admission
    needs: [full-admission, validation-profile]
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    runs-on: [self-hosted, linux, x64, kaori-ci]
    timeout-minutes: 35
    steps:
      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.KAORI_DOCS_SOURCE_SHA }}
          persist-credentials: false
      - name: Enforce runtime admission when runtime implementation exists
        if: ${{ needs.validation-profile.outputs.reuse != 'true' }}
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "$KAORI_DOCS_SOURCE_SHA"
          if [[ -f Dockerfile || -d deploy/server ]]; then
            test -f scripts/container_smoke.sh || {
              echo 'BLOCK: runtime image exists without the reviewed runtime smoke contract (#13).' >&2
              exit 1
            }
            bash scripts/container_smoke.sh "$KAORI_DOCS_SOURCE_SHA"
          else
            printf 'NOT APPLICABLE: no production image exists yet; #13 owns image runtime admission.\n' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Fresh Compose and release-contract smoke for verified reuse
        if: ${{ needs.validation-profile.outputs.reuse == 'true' }}
        shell: bash
        env:
          EVIDENCE_RUN_ID: ${{ needs.validation-profile.outputs.evidence_run_id }}
        run: |
          set -Eeuo pipefail
          [[ "$EVIDENCE_RUN_ID" =~ ^[1-9][0-9]*$ ]] || exit 1
          test "$(git rev-parse HEAD)" = "$KAORI_DOCS_SOURCE_SHA"
          export KAORI_DOCS_IMAGE="docker.io/example/kaori-docs@sha256:$(printf '0%.0s' {1..64})"
          docker compose -f deploy/server/compose.docs.yml -f deploy/server/compose.release.yml config --quiet
          test ! -e deploy/server/compose.staging.yml
          bash -n scripts/release/deploy-release.sh deploy/server/deploy.sh deploy/server/rollback.sh
          echo "PASS: fresh single-slot Docs Compose and RC/stable release guards from trusted full #$EVIDENCE_RUN_ID" >> "$GITHUB_STEP_SUMMARY"

  browser-evidence:
    name: Browser Quality Evidence
    needs: [promotion-source, full-admission, validation-profile]
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    runs-on: [self-hosted, linux, x64, kaori-ci]
    timeout-minutes: 35
    container:
      image: mcr.microsoft.com/playwright:v1.56.1-noble
      options: --init --ipc=host
    permissions:
      contents: read
    steps:
      - name: Checkout exact admitted source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.KAORI_DOCS_SOURCE_SHA }}
          persist-credentials: false
      - name: Set up pinned Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v4.4.0
        with:
          node-version: '22.23.2'
          cache: npm
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Verify browser package identity
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(npx playwright --version)" = "Version 1.56.1"
      - name: Build exact browser candidate
        if: ${{ needs.validation-profile.outputs.reuse != 'true' }}
        run: npm run build
      - name: Test browser layout, navigation, theme, keyboard and accessibility
        if: ${{ needs.validation-profile.outputs.reuse != 'true' }}
        run: npm run test:browser
      - name: Fresh bounded browser and static-site Fast Smoke for verified reuse
        if: ${{ needs.validation-profile.outputs.reuse == 'true' }}
        shell: bash
        env:
          EVIDENCE_RUN_ID: ${{ needs.validation-profile.outputs.evidence_run_id }}
        run: |
          set -Eeuo pipefail
          [[ "$EVIDENCE_RUN_ID" =~ ^[1-9][0-9]*$ ]] || exit 1
          bash scripts/ci/fast-smoke.sh "$KAORI_DOCS_SOURCE_SHA"
          echo "PASS: fresh Docs Fast Smoke after REUSED Full Admission run #$EVIDENCE_RUN_ID" >> "$GITHUB_STEP_SUMMARY"
      - name: Upload browser evidence (including failures)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: kaori-docs-browser-${{ github.sha }}
          path: |
            test-results/
            playwright-report/
          retention-days: 30
          if-no-files-found: warn
      - name: Restore host runner checkout ownership
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          owner="$(stat -c '%u:%g' "$RUNNER_TEMP")"
          [[ "$owner" =~ ^[0-9]+:[0-9]+$ ]] || exit 1
          chown -R "$owner" "$GITHUB_WORKSPACE"

  stable-publication:
    name: Publish Accepted Stable Release
    needs: [promotion-source, full-admission, container-admission, browser-evidence]
    if: >-
      ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.stable_version != '' }}
    runs-on: [self-hosted, linux, x64, platform-ci]
    timeout-minutes: 35
    permissions:
      contents: write
      actions: read
      issues: read
    env:
      GH_TOKEN: ${{ github.token }}
      STABLE_TAG: ${{ inputs.stable_version }}
      ACCEPTED_RC_TAG: ${{ inputs.accepted_candidate_tag }}
      APPROVAL_REF: ${{ inputs.stable_approval_reference }}
      REGISTRY_HOST: ${{ vars.KAORI_DOCS_DOCKER_REGISTRY_HOST }}
      REGISTRY_IMAGE: ${{ vars.KAORI_DOCS_DOCKER_REGISTRY_IMAGE }}
      REGISTRY_USER: ${{ secrets.KAORI_DOCS_DOCKER_REGISTRY_USERNAME }}
      REGISTRY_PASSWORD: ${{ secrets.KAORI_DOCS_DOCKER_REGISTRY_PASSWORD }}
    steps:
      - name: Checkout admitted main identity
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Preflight approved stable RC without mutation
        shell: bash
        run: bash scripts/release/promote-stable.sh preflight
      - name: Verify same signed RC digest and publish stable metadata
        shell: bash
        run: bash scripts/release/promote-stable.sh publish
      - name: Registry logout
        if: always()
        shell: bash
        run: |
          if [[ -n "$REGISTRY_HOST" ]]; then docker logout "$REGISTRY_HOST" || true; fi

  admission-evidence:
    name: Admission Evidence
    # Fresh FULL artifacts are eligible for later verified reuse; REUSED
    # artifacts cannot be chained to bypass the original full authority.
    needs:
      [
        promotion-source,
        validation-profile,
        full-admission,
        container-admission,
        browser-evidence,
      ]
    if: >-
      ${{ needs.promotion-source.result == 'success' &&
          needs.full-admission.result == 'success' &&
          needs.container-admission.result == 'success' &&
          needs.browser-evidence.result == 'success' }}
    runs-on: [self-hosted, linux, x64, platform-ci]
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    env:
      ADMISSION_PROMOTION: ${{ needs.promotion-source.result }}
      ADMISSION_FULL: ${{ needs.full-admission.result }}
      ADMISSION_CONTAINER: ${{ needs.container-admission.result }}
      ADMISSION_BROWSER: ${{ needs.browser-evidence.result }}
      ADMISSION_PROFILE: ${{ needs.validation-profile.outputs.reuse == 'true' && 'reused' || 'full' }}
      ADMISSION_REUSED_FROM: ${{ needs.validation-profile.outputs.evidence_run_id }}
      ADMISSION_HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
    steps:
      - name: Checkout exact tested source and tree
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.KAORI_DOCS_SOURCE_SHA }}
          persist-credentials: false
      - name: Record full-gate source, tree and validation-authority fingerprint
        shell: bash
        run: |
          set -Eeuo pipefail
          bash scripts/ci/admission-evidence.sh write tmp/ci-artifacts/admission-evidence.json
          jq -r '"Source SHA: " + .source_sha + "\nSource tree: " +
            .source_tree_sha + "\nValidation authority: " +
            .validation_authority_fingerprint + "\nProfile: " + .profile + "\nReuse permitted: " + (.reuse_authorized|tostring)' \
            tmp/ci-artifacts/admission-evidence.json >> "$GITHUB_STEP_SUMMARY"
      - name: Publish immutable source-bound admission artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: kaori-docs-admission-${{ env.KAORI_DOCS_SOURCE_SHA }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: tmp/ci-artifacts/admission-evidence.json
          retention-days: 30
          if-no-files-found: error
