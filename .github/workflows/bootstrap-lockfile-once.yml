name: One-time Docs Lockfile Bootstrap

on:
  pull_request:
    branches:
      - kaori/staging
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: write

concurrency:
  group: kaori-docs-once-lockfile-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  capture-lockfile:
    name: Capture Runner-Resolved Lockfile
    if: >-
      ${{ github.event.pull_request.number == 19 &&
          github.event.pull_request.head.repo.full_name == github.repository &&
          github.event.pull_request.head.ref == 'kaori/task-12-docs-ci-admission' }}
    runs-on: [self-hosted, linux, x64, platform-ci]
    timeout-minutes: 15
    steps:
      - name: Checkout exact governed work branch with scoped write token
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: kaori/task-12-docs-ci-admission
          fetch-depth: 0
          persist-credentials: true
      - name: Verify work branch SHA, authority and clean source
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -Eeuo pipefail
          [[ "$GITHUB_REF" == refs/pull/19/merge ]] || exit 1
          [[ "$(git rev-parse HEAD)" == "$EXPECTED_SHA" ]] || exit 1
          [[ "$(git branch --show-current)" == kaori/task-12-docs-ci-admission ]] || exit 1
          test -f .github/workflows/bootstrap-lockfile-once.yml
          test ! -e package-lock.json
          test -z "$(git status --porcelain)"
      - name: Use pinned KAORI toolchain
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v4.4.0
        with:
          node-version: "22.23.2"
      - name: Resolve and verify exact runner-produced lockfile
        shell: bash
        run: |
          set -Eeuo pipefail
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          test -s package-lock.json
          echo 'aded316d29aa26ff1d7e36df4f8512dffd0f4daf79e684a4aae30a192498b4c5  package-lock.json' | sha256sum -c -
          npm audit --audit-level=high
      - name: Commit only verified lockfile and remove one-time workflow
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- package-lock.json
          git rm -- .github/workflows/bootstrap-lockfile-once.yml
          git diff --cached --check
          git diff --cached --name-only
          git commit -m 'build(#11): commit runner-verified Docusaurus dependency lock'
          git push origin HEAD:refs/heads/kaori/task-12-docs-ci-admission
